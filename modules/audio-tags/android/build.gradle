plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.audiotags'
version = '0.1.0'

android {
  namespace 'expo.modules.audiotags'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'net.jthink:jaudiotagger:3.0.1'
}
