plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ambientpalette'
version = '0.1.0'

android {
  namespace "expo.modules.ambientpalette"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation("androidx.palette:palette-ktx:1.0.0")
}
